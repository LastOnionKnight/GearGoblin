name: One-shot 1.6.1 health patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/maintenance-161.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud reference assemblies
        shell: pwsh
        run: |
          $dalamudPath = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudPath -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" `
            -OutFile "$env:TEMP\dalamud-latest.zip"
          Expand-Archive -Path "$env:TEMP\dalamud-latest.zip" -DestinationPath $dalamudPath -Force

      - name: Patch API 15 character identity
        shell: pwsh
        run: |
          $path = 'Plugin.cs'
          $text = Get-Content $path -Raw
          $old = '            ulong contentId = 1; // Fallback since IClientState.LocalContentId was removed in API 10'
          $new = @'
            // Dalamud API 15 moved local-character identity from IClientState
            // to IPlayerState. Never collapse plans into a synthetic shared key:
            // JobPlans is explicitly per-character and per-job.
            ulong contentId = DalamudServices.PlayerState.ContentId;
            if (contentId == 0)
            {
                DalamudServices.ChatGui.PrintError(
                    "[Tonberry Tactics] Import failed: local character identity is not available yet.");
                return;
            }
'@
          if (-not $text.Contains($old)) {
            Write-Error 'Expected contentId fallback line was not found; refusing to patch an unknown Plugin.cs state.'
            exit 1
          }
          $text = $text.Replace($old, $new.TrimEnd("`r", "`n"))
          Set-Content $path $text -NoNewline

      - name: Build
        run: dotnet build -c Release

      - name: Commit successful patch and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/maintenance-161.yml
          git add Plugin.cs
          git commit -m "fix: use API 15 player identity for imported plans [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
